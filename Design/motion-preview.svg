<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 78" role="img" aria-label="KeySwitch: sliding EN and RU language dial">
  <defs>
    <clipPath id="activeText">
      <rect x="64" y="27" width="58" height="30" rx="15">
        <animate attributeName="x" values="64;126;126;64;64" keyTimes="0;0.08;0.5;0.58;1" dur="4s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <rect width="250" height="78" rx="18" fill="#171C23"/>
  <rect x="60" y="23" width="130" height="32" rx="16" fill="#2B333B" stroke="#48525C"/>
  <rect x="64" y="27" width="58" height="24" rx="12" fill="#18A9A8">
    <animate attributeName="x" values="64;126;126;64;64" keyTimes="0;0.08;0.5;0.58;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#18A9A8;#F26B44;#F26B44;#18A9A8;#18A9A8" keyTimes="0;0.08;0.5;0.58;1" dur="4s" repeatCount="indefinite"/>
  </rect>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle">
    <text x="93" y="39" fill="#A6B0B8">EN</text>
    <text x="155" y="39" fill="#A6B0B8">RU</text>
    <g clip-path="url(#activeText)" fill="#FFFFFF">
      <text x="93" y="39">EN</text>
      <text x="155" y="39">RU</text>
    </g>
  </g>
  <rect x="60" y="23" width="130" height="32" rx="16" fill="none" stroke="#18A9A8" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0;0;0.6;0" keyTimes="0;0.09;0.18;0.5;0.59;1" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
